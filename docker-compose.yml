services:
  spark: 
    build: .
    container_name: tradecorp_training_spark
    ports:
      - '8888:8888'
      - '4040:4040'
    volumes:
      - ./data:/home/jovyan/data
      - ./notebooks:/home/jovyan/work
      - ./src:/home/jovyan/src
      - ./tests:/home/jovyan/tests
      - ./.env:/home/jovyan/.env
      - ./pytest.ini:/home/jovyan/pytest.ini
    environment:
      PYSPARK_SUBMIT_ARGS: '--packages org.postgresql:postgresql:42.7.0 pyspark-shell'
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  postgres:
    image: postgres:16
    container_name: tradecorp_training_postgres
    environment: 
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5433:5432'
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data
  
  pgadmin:
    image: dpage/pgadmin4
    container_name: tradecorp_training_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - '8080:80'
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres
  
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: tradecorp_airflow
    depends_on:
      - postgres
    ports:
      - '8081:8080'
    volumes: 
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data/trigger:/opt/airflow/data/trigger
      - ./.env:/opt/airflow/.env
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: >
        bash -c "
        airflow db init &&
        airflow users create
        --username ${AIRFLOW_ADMIN_USERNAME}
        --password ${AIRFLOW_ADMIN_PASSWORD}
        --firstname Admin
        --lastname Admin
        --role Admin
        --email ${AIRFLOW_ADMIN_EMAIL} || true &&
        airflow webserver &
        airflow scheduler
        "
volumes:
  airflow_pgdata:
  pgadmin: